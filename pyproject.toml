[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripclipper"
version = "0.1.0"
description = "TripClipper — local-first media triage and rough-cut planning tool (M0 skeleton & data contract)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "click",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tripclipper = "tripclipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
