    const ACTIONS = {
      discard: "舍弃",
      fallback: "低优先级备用",
      review: "人工复核",
      likely_use: "大概率入片",
      highlight: "重点高光"
    };
    const SCOPE = { whole_asset: "整段可用", clip_only: "仅局部片段" };
    const ERROR_TYPES = [
      ["", "请选择错误类型"],
      ["overrated_ordinary", "普通素材被高估"],
      ["underrated_highlight", "局部高光被低估"],
      ["ignored_technical", "忽视技术问题"],
      ["invented_evidence", "虚构或夸大可见事件"],
      ["misjudged_editing_value", "误判剪辑价值"],
      ["timecode_issue", "片段时间范围不准确"],
      ["rating_boundary", "星级门槛理解错误"],
      ["none", "评分合理 / 无错误"],
      ["other", "其他"],
    ];
    const STORAGE_PREFIX = "tripclipper:rating-review:26shidu:run-002:";
    let activeFilter = "severe";

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseTime(value) {
      const parts = String(value || "0").split(":").map(Number);
      if (parts.some(Number.isNaN)) return 0;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    function stars(score, kind) {
      return Array.from({length: 5}, (_, i) =>
        '<span class="' + (i < score ? "on " + kind : "") + '">★</span>'
      ).join("");
    }

    function deltaClass(item) {
      if (item.delta > 0) return "over";
      if (item.delta < 0) return "under";
      return "exact";
    }

    function deltaText(item) {
      if (item.delta > 0) return "高估 +" + item.delta + " 星";
      if (item.delta < 0) return "低估 " + item.delta + " 星";
      return "评分一致";
    }

    function matches(item) {
      if (activeFilter === "all") return true;
      if (activeFilter === "exact") return item.gap === 0;
      if (activeFilter === "one") return item.gap === 1;
      return item.gap >= 2;
    }

    function sorted(items) {
      const mode = document.getElementById("sortSelect").value;
      return [...items].sort((a, b) => {
        if (mode === "human-desc") return b.expected_rating - a.expected_rating || b.gap - a.gap;
        if (mode === "model-desc") return b.candidate_rating - a.candidate_rating || b.gap - a.gap;
        if (mode === "path") return a.relative_path.localeCompare(b.relative_path, "zh-CN");
        return b.gap - a.gap || b.delta - a.delta;
      });
    }

    function clipsMarkup(item, cardIndex) {
      if (!item.clip_suggestions.length) return '<div class="manual-note">模型未给出推荐片段</div>';
      return '<div class="clips">' + item.clip_suggestions.map((clip, clipIndex) =>
        '<div class="clip">' +
          '<button class="seek" data-card="' + cardIndex + '" data-time="' + parseTime(clip.in) + '">' +
            esc(clip.in) + ' → ' + esc(clip.out) +
          '</button>' +
          '<div><div class="clip-title">' + esc(clip.role || "推荐片段") + ' · ' + esc(clip.rating) + ' 星</div>' +
          '<div class="clip-reason">' + esc(clip.reason || "") + '</div></div>' +
        '</div>'
      ).join("") + '</div>';
    }

    function errorOptions() {
      return ERROR_TYPES.map(entry =>
        '<option value="' + esc(entry[0]) + '">' + esc(entry[1]) + '</option>'
      ).join("");
    }

    function annotationMarkup(item) {
      return '<section class="annotation-panel" data-asset-id="' + esc(item.asset_id) + '">' +
        '<div class="annotation-head"><span class="annotation-title">人工错误归因</span><span class="save-status">尚未填写</span></div>' +
        '<div class="annotation-grid">' +
          '<div class="annotation-field"><label>模型错误类型</label><select class="annotation-error-type">' + errorOptions() + '</select></div>' +
          '<div class="annotation-field"><label>人工认定的最佳片段</label><div class="time-grid">' +
            '<input class="annotation-clip-in" type="text" inputmode="numeric" placeholder="起点，如 00:03">' +
            '<input class="annotation-clip-out" type="text" inputmode="numeric" placeholder="终点，如 00:08">' +
          '</div></div>' +
          '<div class="annotation-field wide"><label>人工评分理由</label>' +
            '<textarea class="annotation-reason" placeholder="写出可观察事实、决定星级的门槛，以及模型具体错在哪里。"></textarea>' +
          '</div>' +
        '</div>' +
        '<div class="annotation-hint">输入内容只保存在当前浏览器 localStorage；完成后请导出 CSV 留档。</div>' +
      '</section>';
    }

    function cardMarkup(item, index) {
      const signal = deltaClass(item);
      const note = item.notes || "未填写额外备注";
      return '<article class="review-card ' + signal + '" style="animation-delay:' + Math.min(index * 45, 360) + 'ms">' +
        '<div class="media-side">' +
          '<span class="asset-index">#' + String(index + 1).padStart(2, "0") + '</span>' +
          '<video id="video-' + index + '" controls preload="metadata" src="' + esc(item.media_uri) + '">' +
            '浏览器无法播放此本地视频：' + esc(item.relative_path) +
          '</video>' +
        '</div>' +
        '<div class="details">' +
          '<div class="topline"><div><p class="path">' + esc(item.relative_path) + '</p><h2>' + esc(item.content_title) + '</h2></div>' +
          '<span class="gap-chip ' + signal + '">' + deltaText(item) + '</span></div>' +
          '<div class="score-row">' +
            '<div class="score-box"><span class="score-number">' + item.expected_rating + '</span><div class="score-label">人工评分</div><div class="score-stars">' + stars(item.expected_rating, "human") + '</div></div>' +
            '<div class="score-box"><span class="score-number">' + item.candidate_rating + '</span><div class="score-label">Prompt评分</div><div class="score-stars">' + stars(item.candidate_rating, "model") + '</div></div>' +
          '</div>' +
          '<div class="meta-row"><span class="meta-pill">' + esc(ACTIONS[item.expected_action] || item.expected_action || "未标注处理") + '</span>' +
          '<span class="meta-pill">' + esc(SCOPE[item.whole_asset_or_clip] || item.whole_asset_or_clip || "未标注范围") + '</span>' +
          '<span class="meta-pill">' + esc(item.asset_id) + '</span></div>' +
          '<div class="section-label">人工备注</div><p class="summary manual-note">' + esc(note) + '</p>' +
          '<div class="section-label">模型摘要</div><p class="summary">' + esc(item.summary) + '</p>' +
          '<div class="section-label">模型推荐片段</div>' + clipsMarkup(item, index) +
          annotationMarkup(item) +
        '</div>' +
      '</article>';
    }

    function storageKey(assetId) {
      return STORAGE_PREFIX + assetId;
    }

    function readAnnotation(assetId) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(assetId)) || "{}") || {};
      } catch (_) {
        return {};
      }
    }

    function writeAnnotation(assetId, annotation) {
      const payload = { ...annotation, updatedAt: new Date().toISOString() };
      localStorage.setItem(storageKey(assetId), JSON.stringify(payload));
      return payload;
    }

    function formatSavedAt(value) {
      if (!value) return "尚未填写";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "已自动保存" : "已保存 " + date.toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"});
    }

    function updateAnnotationProgress() {
      const completed = DATA.filter(item => (readAnnotation(item.asset_id).reason || "").trim()).length;
      document.getElementById("annotationProgress").textContent = "已写理由 " + completed + " / " + DATA.length;
    }

    function bindAnnotations() {
      document.querySelectorAll(".annotation-panel").forEach(panel => {
        const assetId = panel.dataset.assetId;
        const reason = panel.querySelector(".annotation-reason");
        const errorType = panel.querySelector(".annotation-error-type");
        const clipIn = panel.querySelector(".annotation-clip-in");
        const clipOut = panel.querySelector(".annotation-clip-out");
        const status = panel.querySelector(".save-status");
        const saved = readAnnotation(assetId);
        reason.value = saved.reason || "";
        errorType.value = saved.errorType || "";
        clipIn.value = saved.clipIn || "";
        clipOut.value = saved.clipOut || "";
        status.textContent = formatSavedAt(saved.updatedAt);

        const persist = () => {
          const next = writeAnnotation(assetId, {
            reason: reason.value,
            errorType: errorType.value,
            clipIn: clipIn.value,
            clipOut: clipOut.value,
          });
          status.textContent = formatSavedAt(next.updatedAt);
          updateAnnotationProgress();
        };
        [reason, errorType, clipIn, clipOut].forEach(control => control.addEventListener("input", persist));
      });
      updateAnnotationProgress();
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return /[",\r\n]/.test(text) ? '"' + text.replaceAll('"', '""') + '"' : text;
    }

    function exportAnnotations() {
      const fields = [
        "asset_id", "relative_path", "expected_rating", "candidate_rating", "rating_delta",
        "expected_action", "whole_asset_or_clip", "human_rating_reason", "model_error_type",
        "best_clip_in", "best_clip_out", "annotation_updated_at"
      ];
      const rows = DATA.map(item => {
        const saved = readAnnotation(item.asset_id);
        return [
          item.asset_id, item.relative_path, item.expected_rating, item.candidate_rating, item.delta,
          item.expected_action, item.whole_asset_or_clip, saved.reason || "", saved.errorType || "",
          saved.clipIn || "", saved.clipOut || "", saved.updatedAt || ""
        ];
      });
      const csv = "\ufeff" + [fields, ...rows].map(row => row.map(csvCell).join(",")).join("\r\n") + "\r\n";
      const url = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
      const link = document.createElement("a");
      link.href = url;
      link.download = "rating-validation-run-002-annotations.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function render() {
      const items = sorted(DATA.filter(matches));
      const root = document.getElementById("cards");
      document.getElementById("visibleCount").textContent = "显示 " + items.length + " / " + DATA.length;
      root.innerHTML = items.length
        ? items.map(cardMarkup).join("")
        : '<div class="empty">当前筛选没有素材</div>';

      root.querySelectorAll(".seek").forEach(button => {
        button.addEventListener("click", () => {
          const video = document.getElementById("video-" + button.dataset.card);
          if (!video) return;
          video.currentTime = Number(button.dataset.time) || 0;
          video.play().catch(() => {});
          video.scrollIntoView({behavior: "smooth", block: "center"});
        });
      });
      bindAnnotations();
    }

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".filter-btn").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        render();
      });
    });
    document.getElementById("sortSelect").addEventListener("change", render);
    document.getElementById("exportAnnotations").addEventListener("click", exportAnnotations);
    render();
  </script>
